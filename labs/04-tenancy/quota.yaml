apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: team-retail
spec: 
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 1Gi
    pods: "10"
    count/jobs.batch: "5"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: team-stores
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 1Gi
    pods: "10"
    count/jobs.batch: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: team-retail
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 64Mi
    default:
      memory: 128Mi
    max:
      memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: team-stores
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 64Mi
    default:
      memory: 128Mi
    max:
      memory: 512Mi
---