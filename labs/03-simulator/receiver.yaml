apiVersion: v1
kind: Service
metadata:
  name: callback-receiver
  namespace: simulator
spec:
  selector:
    app.kubernetes.io/name: callback-receiver
  ports:
    - protocol: TCP
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: callback-receiver
  namespace: simulator
  labels:
    app.kubernetes.io/name: callback-receiver
spec:
  replicas: 1
  minReadySeconds: 30
  progressDeadlineSeconds: 60
  # The Deployment manages Pods whose labels match this. Immutable after creation.
  selector:
    matchLabels:
      app.kubernetes.io/name: callback-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: callback-receiver   # must satisfy spec.selector
    spec:
      containers:
        - name: receiver
          # use existing image with cmd override to run the receiver
          image: payment-simulator:0.4.0
          command: ['uvicorn', 'receiver:app', '--host', '0.0.0.0', '--port', '8080']
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
      topologySpreadConstraints:
        # Constraints apply only at scheduling time. matchLabelKeys stops a rollout
        # from counting the old revision's Pods (which then get deleted).
        # Zones: prefer balance, but never block failover during a zone outage.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: callback-receiver
          matchLabelKeys: [pod-template-hash]   # spread each revision on its own
        # Nodes: never put all replicas on one node. Honor taints so the
        # tainted control-plane node isn't counted as an empty domain.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: callback-receiver
          matchLabelKeys: [pod-template-hash]   # spread each revision on its own
