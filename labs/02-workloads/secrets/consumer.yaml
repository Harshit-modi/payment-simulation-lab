apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: lab01
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - "sleep 3600"
    env:
    - name: ACME_API_KEY
      valueFrom:
        secretKeyRef:
          name: acme-pay-credentials
          key: api-key
    volumeMounts:
    - name: acme-pay-credentials
      mountPath: /etc/acme
  volumes:
  - name: acme-pay-credentials
    secret:
      secretName: acme-pay-credentials
  restartPolicy: Never
  resources:
    requests:
      memory: "32Mi"
    limits:
      memory: "64Mi"
