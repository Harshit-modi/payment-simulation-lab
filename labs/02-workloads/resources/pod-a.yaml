apiVersion: v1
kind: Pod
metadata:
  name: pod-a
  namespace: lab01
spec:
  containers:
  - name: busybox
    image: busybox:1.36
    command:
    - /bin/sh
    - -c
    - "while :; do :; done"
  restartPolicy: Never
  resources:
    requests:
      cpu: "5000m"
      memory: "32Mi"
    limits:
      memory: "64Mi"
