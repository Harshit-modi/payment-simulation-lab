apiVersion: batch/v1
kind: Job
metadata:
  generateName: acme-pay-contract-check-
  namespace: lab01
  labels:
    app.kubernetes.io/name: contract-check
spec:
  template:
    spec:
      containers:
      - name: contract-check
        image: busybox:1.36
        env:
          - name: TARGET_URL
            value: http://acme-pay.lab01.svc.cluster.local/v1/payments/authorize
          - name: EXPECTED_STATUS
            value: DECLINED
          - name: EXPECTED_RESPONSE_CODE
            value: "05"
          - name: EXPECTED_PROCESSOR
            value: acme-pay
        command:
          - /bin/sh
          - -c
          - |
            if wget -S -q -O /tmp/response-body "$TARGET_URL" 2>/tmp/response-headers
            then
              failed=0
              check() {
                # $1 = what is checked, $2 = expected text, $3 = file to search
                if grep -qiF "$2" "$3"   # literal, case-insensitive (headers may be lowercase)
                then
                  echo "PASS: $1"
                else
                  echo "FAIL: $1"
                  echo "  expected: $2"
                  failed=1
                fi
              }
              check "response body status" "\"status\": \"$EXPECTED_STATUS\"" /tmp/response-body
              check "response body responseCode" "\"responseCode\": \"$EXPECTED_RESPONSE_CODE\"" /tmp/response-body
              check "response header X-Processor" "X-Processor: $EXPECTED_PROCESSOR" /tmp/response-headers
              if [ "$failed" -eq 0 ]
              then
                echo "Contract check passed"
              else
                echo "--- actual response body ---"
                cat /tmp/response-body
                echo "--- actual response headers ---"
                cat /tmp/response-headers
                exit 2
              fi
            else
              echo "Contract check failed: request to acme-pay did not succeed"
              cat /tmp/response-headers
              exit 1
            fi
      restartPolicy: Never
  backoffLimit: 2
  activeDeadlineSeconds: 60
  ttlSecondsAfterFinished: 600
  # 1) no retry on exit code 2, 2) ignore node disruptions, but 3) retry on exit code 1 (request failed)
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          operator: In
          values: [2]
          containerName: contract-check
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: Count
        onExitCodes:
          operator: In
          values: [1]
          containerName: contract-check