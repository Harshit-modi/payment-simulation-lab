apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-mock
  namespace: lab01
  labels:
    app.kubernetes.io/name: processor-mock
spec:
  replicas: 2
  progressDeadlineSeconds: 60
  # The Deployment manages Pods whose labels match this. Immutable after creation.
  selector:
    matchLabels:
      app.kubernetes.io/name: processor-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor-mock   # must satisfy spec.selector
        processor: acme-pay
    spec:
      containers:
        - name: nginx
          # Unprivileged variant runs as a non-root user and listens on 8080.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d       # replaces the image's default.conf
            - name: responses
              mountPath: /usr/share/nginx/mock
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: processor-mock-nginx-v1
        - name: responses
          configMap:
            name: processor-mock-responses
